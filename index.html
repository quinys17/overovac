<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d16">
<title>MTA | Overenie výhry</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--line:#263247;--muted:#94a3b8;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(ellipse at 50% 0%,#172554 0%,var(--bg) 55%);color:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif;display:grid;place-items:center}
.container{width:min(100%,480px);padding:36px 30px;background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 80px #0008}
.logo{width:66px;height:66px;margin:0 auto 20px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:25px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 30px #2563eb44}
h1{text-align:center;font-size:26px;margin:0 0 9px}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 30px}
label{display:block;margin:0 0 10px;color:#cbd5e1;font-size:12px;font-weight:800;letter-spacing:1px}
input{width:100%;padding:16px;border-radius:11px;border:1px solid #334155;background:#0b1220;color:white;font-size:16px;text-align:center;letter-spacing:1.5px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3b82f633}
button{width:100%;margin-top:16px;padding:16px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;font-size:13px;font-weight:900;letter-spacing:1px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:20px;padding:17px;border-radius:12px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.result.success{display:block;background:#16a34a18;border:1px solid #15803d;color:#bbf7d0}
.result.error{display:block;background:#dc262618;border:1px solid #b91c1c;color:#fecaca}
.result h2{font-size:16px;margin:0 0 5px}.hint{color:var(--muted);font-size:12px;text-align:center;margin:20px 0 0}
.footer{text-align:center;color:#64748b;font-size:11px;letter-spacing:1px;margin-top:28px}
</style>
</head>
<body>
<main class="container">
  <div class="logo">MTA</div>
  <h1>Overenie výhry</h1>
  <p class="subtitle">Zadaj výherný kód a over, či sa nachádza v našom systéme.</p>
  <form id="verifyForm">
    <label for="code">VÝHERNÝ KÓD</label>
    <input id="code" name="code" type="text" maxlength="128" placeholder="ZADAJ SVOJ KÓD" autocomplete="off" required>
    <button id="submitBtn" type="submit">OVERIŤ KÓD</button>
  </form>
  <section id="result" class="result" role="status" aria-live="polite"></section>
  <p class="hint">Overenie zatiaľ iba kontroluje existenciu kódu. Kód sa nemení ani nespotrebúva.</p>
  <div class="footer">MTA SERVER · REWARDS SYSTEM</div>
</main>
<script>
/*
  Po nasadení PHP API zmeň túto adresu, napríklad:
  const API_URL = "https://tvoj-web.sk/api/verify.php";
*/
const API_URL = "https://SEM_DOPLN_ADRESU_TVOJHO_API/api/verify.php";

const form = document.getElementById("verifyForm");
const input = document.getElementById("code");
const button = document.getElementById("submitBtn");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const code = input.value.trim();
  if (!code) return;

  button.disabled = true;
  button.textContent = "OVERUJEM...";
  result.className = "result";
  result.style.display = "none";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code})
    });
    const data = await response.json();

    if (!response.ok) throw new Error(data.message || "Chyba servera.");

    result.style.display = "block";
    if (data.valid === true) {
      result.className = "result success";
      result.innerHTML = "<h2>✓ Kód je platný</h2><div>Kód sa nachádza v databáze.</div>";
    } else {
      result.className = "result error";
      result.innerHTML = "<h2>✕ Kód sa nenašiel</h2><div>" + escapeHTML(data.message || "Tento kód nie je evidovaný.") + "</div>";
    }
  } catch (error) {
    result.style.display = "block";
    result.className = "result error";
    result.innerHTML = "<h2>Chyba spojenia</h2><div>" +
      escapeHTML(error.message || "Nepodarilo sa spojiť s overovacím serverom.") +
      "</div><div>Skontroluj adresu API a jeho nastavenie.</div>";
  } finally {
    button.disabled = false;
    button.textContent = "OVERIŤ KÓD";
  }
});

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}
</script>
</body>
</html>
